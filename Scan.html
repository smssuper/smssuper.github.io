<!-- Gunakan kode ini untuk stabilitas lebih baik -->
<script>
    // Alih-alih setInterval, gunakan fungsi capture tunggal
    async function takeSnapshotAndScan() {
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);

        // Scan hanya satu kali saat dipanggil
        const { data: { text } } = await worker.recognize(canvas);
        const match = text.match(/\d{15}/); // Mencari 15 digit angka

        if (match) {
            hasilScan.value = match[0];
            stopScanner();
        } else {
            alert("Nomor tidak terbaca, coba posisikan lebih jelas.");
        }
    }
</script>
