<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner 15 Digit</title>
    <!-- Library Tesseract.js untuk OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    
    <style>
        body { 
            font-family: Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px; 
            background: #f4f4f9; 
        }
        .container { 
            background: white; 
            padding: 20px; 
            border-radius: 10px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
        }
        
        /* Area Kamera Live */
        #videoContainer { 
            position: relative; 
            width: 100%; 
            height: 250px; 
            background: #000; 
            overflow: hidden; 
            border-radius: 8px; 
            margin-bottom: 15px; 
            display: none; 
        }
        video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }
        
        /* Input Teks */
        input { 
            width: 90%; 
            padding: 12px; 
            margin-bottom: 15px; 
            font-size: 18px; 
            border: 2px solid #ddd; 
            border-radius: 5px; 
            text-align: center; 
            font-weight: bold; 
            color: #ee4d2d; 
            letter-spacing: 1px;
        }
        
        #status {
            font-size: 13px;
            color: #666;
            margin-bottom: 15px;
        }

        /* Tombol Utama */
        .button-group { 
            display: flex; 
            gap: 10px; 
        }
        button { 
            flex: 1; 
            padding: 12px; 
            border: none; 
            border-radius: 5px; 
            color: white; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.2s;
        }
        .btn-scan { background-color: #ff5722; } /* Oranye */
        .btn-scan:hover { background-color: #e64a19; }
        
        .btn-copy { background-color: #2196F3; } /* Biru */
        .btn-copy:hover { background-color: #0b7dda; }
        
        .btn-hapus { background-color: #f44336; } /* Merah */
        .btn-hapus:hover { background-color: #da190b; }

        /* Tombol Ekstra (Opsional) */
        .btn-stop {
            background-color: #9e9e9e;
            width: 100%;
            margin-top: 15px;
            padding: 8px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Scanner VA (15 Digit)</h2>
    
    <div id="videoContainer">
        <video id="video" autoplay playsinline></video>
    </div>

    <div id="status">Kamera belum aktif.</div>

    <input type="text" id="hasilScan" placeholder="Hasil 15 digit..." readonly>
    
    <!-- Tiga Tombol Utama Sesuai Permintaan -->
    <div class="button-group">
        <button class="btn-scan" onclick="startScanner()">Scan</button>
        <button class="btn-copy" onclick="copyNomor()">Copy</button>
        <button class="btn-hapus" onclick="hapusNomor()">Hapus</button>
    </div>

    <!-- Tombol terpisah untuk mematikan kamera agar tidak mengganggu fungsi Hapus -->
    <button class="btn-stop" onclick="stopScanner()">Matikan Kamera</button>
</div>

<script>
    let video = document.getElementById('video');
    let videoContainer = document.getElementById('videoContainer');
    let hasilScan = document.getElementById('hasilScan');
    let statusText = document.getElementById('status');
    let worker;
    let scanInterval;

    // 1. Logika Scan (Mulai Kamera & OCR)
    async function startScanner() {
        if (video.srcObject) return; // Mencegah klik double jika kamera sudah nyala

        videoContainer.style.display = 'block';
        statusText.innerText = "Kamera aktif. Arahkan ke nomor 15 digit...";
        
        // Inisialisasi Tesseract Worker
        worker = await Tesseract.createWorker('eng');
        await worker.setParameters({ tessedit_char_whitelist: '0123456789 ' });

        // Akses kamera belakang
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            video.srcObject = stream;
        } catch (err) {
            statusText.innerText = "Gagal mengakses kamera!";
            return;
        }

        // Looping pembacaan frame video setiap 1 detik
        scanInterval = setInterval(async () => {
            if (video.srcObject && video.readyState === video.HAVE_ENOUGH_DATA) {
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                
                const { data: { text } } = await worker.recognize(canvas);
                
                // LOGIKA 15 DIGIT:
                // Mencari kelompok angka yang tepat berjumlah 15 (mengabaikan spasi di antaranya)
                const regex = /(?:^|[^\d])((?:\d\s*){15})(?:[^\d]|$)/;
                const match = text.match(regex);

                if (match) {
                    // Bersihkan spasi agar murni 15 digit rapat
                    const nomorBersih = match[1].replace(/\s/g, '');
                    
                    if (nomorBersih.length === 15) {
                        hasilScan.value = nomorBersih;
                        statusText.innerText = "Nomor berhasil ditemukan!";
                        stopScanner(); // Matikan kamera otomatis karena sudah berhasil
                    }
                }
            }
        }, 1000);
    }

    // 2. Logika Copy
    function copyNomor() {
        if (hasilScan.value === "") {
            alert("Kosong! Belum ada nomor yang di-scan.");
            return;
        }
        navigator.clipboard.writeText(hasilScan.value).then(() => {
            alert("Berhasil disalin: " + hasilScan.value);
        }).catch(() => {
            alert("Gagal menyalin.");
        });
    }

    // 3. Logika Hapus (HANYA menghapus teks)
    function hapusNomor() {
        hasilScan.value = "";
        statusText.innerText = video.srcObject ? "Teks dihapus. Lanjut scan..." : "Teks dihapus.";
    }

    // 4. Logika Stop Kamera (dipisah dari fungsi hapus)
    function stopScanner() {
        if (video.srcObject) {
            video.srcObject.getTracks().forEach(track => track.stop());
            video.srcObject = null;
        }
        clearInterval(scanInterval);
        if (worker) worker.terminate();
        videoContainer.style.display = 'none';
        
        if(hasilScan.value !== "") {
            statusText.innerText = "Kamera dimatikan.";
        } else {
            statusText.innerText = "Kamera belum aktif.";
        }
    }
</script>

</body>
</html>
