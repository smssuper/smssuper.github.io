<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Scan Nomor Rekening</title>
    
    <!-- Memanggil library Tesseract.js (OCR) dari internet -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px;
            margin: 0;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 { margin-top: 0; color: #333; }
        
        /* Input file disembunyikan, kita gunakan tombol custom */
        #kameraInput { display: none; }
        
        /* Kolom lampiran hasil scan */
        input[type="text"] {
            width: 90%;
            padding: 12px;
            margin-bottom: 10px;
            font-size: 18px;
            border: 2px solid #ccc;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
            color: #ee4d2d; /* Warna oranye Shopee */
            letter-spacing: 2px;
        }
        #status {
            font-size: 13px;
            color: #666;
            margin-bottom: 20px;
            min-height: 20px;
        }
        
        /* Tombol */
        .button-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            font-weight: bold;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-scan { background-color: #ff5722; width: 100%; margin-bottom: 15px;} /* Oranye */
        .btn-scan:hover { background-color: #e64a19; }
        .btn-copy { background-color: #2196F3; flex: 1;} /* Biru */
        .btn-copy:hover { background-color: #0b7dda; }
        .btn-hapus { background-color: #f44336; flex: 1;} /* Merah */
        .btn-hapus:hover { background-color: #da190b; }
        
        /* Loader */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #ff5722;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: none;
            margin: 0 auto 10px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Scanner Nomor VA</h2>
        
        <!-- Input untuk membuka kamera (khusus HP) atau file explorer -->
        <input type="file" id="kameraInput" accept="image/*" capture="environment" onchange="prosesGambar(event)">
        
        <!-- Tombol Scan Utama -->
        <button class="btn-scan" onclick="bukaKamera()">📷 Scan Nomor dari Kamera</button>
        
        <div class="loader" id="loadingSpinner"></div>
        <div id="status">Siap digunakan.</div>
        
        <!-- Lampiran hasil scan -->
        <input type="text" id="hasilScan" placeholder="Nomor akan muncul di sini..." readonly>
        
        <!-- Tombol Aksi -->
        <div class="button-group">
            <button class="btn-copy" onclick="copyNomor()">Copy</button>
            <button class="btn-hapus" onclick="hapusNomor()">Hapus</button>
        </div>
    </div>

    <script>
        const statusText = document.getElementById('status');
        const loader = document.getElementById('loadingSpinner');
        const hasilInput = document.getElementById('hasilScan');

        // 1. Logika membuka kamera
        function bukaKamera() {
            document.getElementById('kameraInput').click();
        }

        // 2. Logika memproses gambar dengan AI (Tesseract)
        async function prosesGambar(event) {
            const file = event.target.files[0];
            if (!file) return;

            statusText.innerText = "Membaca gambar... Mohon tunggu beberapa detik.";
            loader.style.display = "block";
            hasilInput.value = "";

            try {
                // Inisialisasi Tesseract (gunakan bahasa Inggris karena file datanya lebih ringan untuk angka)
                const worker = await Tesseract.createWorker('eng');
                
                // PENTING: Batasi deteksi hanya untuk angka dan spasi agar sangat cepat & akurat
                await worker.setParameters({
                    tessedit_char_whitelist: '0123456789 ', 
                });

                // Proses gambar
                const { data: { text } } = await worker.recognize(file);
                await worker.terminate();

                // Logika Filter (Regex)
                // Mencari deretan angka yang panjangnya minimal 10 digit (untuk menyaring angka jam/nominal kecil)
                const match = text.match(/(?:\d\s*){10,}/); 

                if (match) {
                    // Hapus spasi agar rapi dan mudah di-paste ke aplikasi bank
                    const nomorBersih = match[0].replace(/\s/g, ''); 
                    hasilInput.value = nomorBersih;
                    statusText.innerText = "Berhasil! Nomor ditemukan.";
                } else {
                    statusText.innerText = "Nomor Virtual Account tidak terdeteksi.";
                    alert("Gagal menemukan nomor panjang. Pastikan foto fokus dan jelas pada bagian nomor rekening.");
                }
            } catch (error) {
                statusText.innerText = "Terjadi kesalahan sistem.";
                console.error(error);
            } finally {
                loader.style.display = "none";
                // Reset input file agar bisa scan gambar yang sama lagi jika perlu
                event.target.value = ""; 
            }
        }

        // 3. Logika Tombol Copy
        function copyNomor() {
            if (hasilInput.value === "") {
                alert("Kolom kosong! Silakan scan terlebih dahulu.");
                return;
            }
            hasilInput.select();
            hasilInput.setSelectionRange(0, 99999); // Kompatibilitas HP
            
            navigator.clipboard.writeText(hasilInput.value).then(() => {
                statusText.innerText = "Nomor berhasil di-copy!";
            }).catch(() => {
                alert("Gagal menyalin nomor.");
            });
        }

        // 4. Logika Tombol Hapus
        function hapusNomor() {
            hasilInput.value = "";
            statusText.innerText = "Siap digunakan.";
        }
    </script>

</body>
</html>
