<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-Sync VA</title>
    
    <script type="module">
        // Import Firebase App dan Realtime Database
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

        // Konfigurasi Firebase asli milik Anda
        const firebaseConfig = {
            apiKey: "AIzaSyBczEs357-LAAkF8TsSsm1ZC7b57aC2FkA",
            authDomain: "vacopy-1ced3.firebaseapp.com",
            databaseURL: "https://vacopy-1ced3-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "vacopy-1ced3",
            storageBucket: "vacopy-1ced3.firebasestorage.app",
            messagingSenderId: "876438682543",
            appId: "1:876438682543:web:cef32ca1b989cae2410d5a",
            measurementId: "G-N73YZJLG5M"
        };

        // Inisialisasi Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const dataRef = ref(db, 'nomor_va');
        const inputField = document.getElementById('hasilInput');

        // 1. Membaca data dari Firebase secara otomatis (Real-time)
        onValue(dataRef, (snapshot) => {
            const data = snapshot.val();
            if (data && data.nomor) {
                inputField.value = data.nomor;
            }
        });

        // 2. Logika Auto-Paste & Simpan ke Firebase
        window.autoPaste = async function() {
            try {
                const text = await navigator.clipboard.readText();
                const cleanText = text.replace(/\D/g, ''); 
                
                // Pastikan minimal 10 digit agar teks acak tidak masuk
                if (cleanText.length >= 10) {
                    inputField.value = cleanText;
                    // Simpan data ke Firebase agar tersinkronisasi
                    set(dataRef, { nomor: cleanText }); 
                }
            } catch (err) { 
                alert("Izinkan akses clipboard pada browser Anda!"); 
            }
        };

        // 3. Logika Hapus (menghapus dari UI dan Firebase)
        window.hapusInput = function() {
            inputField.value = "";
            set(dataRef, { nomor: "" });
        };
    </script>
    
    <style>
        body { 
            font-family: Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 40px 20px; 
            background: #f4f4f9; 
            margin: 0;
        }
        .container { 
            background: white; 
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
        }
        h2 { color: #333; margin-bottom: 5px; }
        p { font-size: 13px; color: #666; margin-bottom: 25px; }
        
        input { 
            width: 90%; 
            padding: 15px; 
            margin-bottom: 20px; 
            font-size: 20px; 
            border: 2px solid #ddd; 
            border-radius: 8px; 
            text-align: center; 
            font-weight: bold; 
            color: #ee4d2d; 
            background-color: #fffaf9;
            cursor: pointer;
        }
        
        .btn-hapus { 
            background-color: #f44336; 
            padding: 15px; 
            border: none; 
            border-radius: 8px; 
            color: white; 
            font-weight: bold; 
            cursor: pointer; 
            width: 100%; 
            font-size: 16px;
        }
        .btn-hapus:hover { background-color: #da190b; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Sync VA Data</h2>
        <p>Klik kolom di bawah untuk mengambil angka yang di-copy</p>
        
        <input type="text" id="hasilInput" placeholder="Tekan di sini..." onclick="autoPaste()" readonly>
        
        <button class="btn-hapus" onclick="hapusInput()">Hapus Data Sinkronisasi</button>
    </div>

</body>
</html>
