<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Clipboard VA</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 40px 20px; 
            background: #f4f4f9; 
            margin: 0;
        }
        .container { 
            background: white; 
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
        }
        h2 { color: #333; margin-bottom: 20px; }
        
        /* Kolom tempat angka muncul */
        input { 
            width: 90%; 
            padding: 15px; 
            margin-bottom: 20px; 
            font-size: 20px; 
            border: 2px solid #ddd; 
            border-radius: 8px; 
            text-align: center; 
            font-weight: bold; 
            color: #ee4d2d; 
            background-color: #fffaf9;
        }
        
        .button-group { display: flex; gap: 15px; }
        button { 
            flex: 1; 
            padding: 15px; 
            border: none; 
            border-radius: 8px; 
            color: white; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 16px;
        }
        .btn-copy { background-color: #2196F3; }
        .btn-hapus { background-color: #f44336; }
    </style>
</head>
<body>

<div class="container">
    <h2>Ambil Nomor VA</h2>
    <p style="font-size: 12px; color: #666; margin-bottom: 20px;">
        Klik kolom di bawah untuk mengambil angka yang di-copy
    </p>

    <!-- Kolom Input -->
    <input type="text" id="hasilInput" placeholder="Tekan di sini untuk ambil..." onclick="autoPaste()">
    
    <div class="button-group">
        <button class="btn-copy" onclick="copyResult()">Copy</button>
        <button class="btn-hapus" onclick="hapusInput()">Hapus</button>
    </div>
</div>

<script>
    const inputField = document.getElementById('hasilInput');

    // 1. Logika Auto-Paste
    // Fungsi ini akan berjalan saat input diklik
    async function autoPaste() {
        try {
            // Meminta izin membaca clipboard
            const text = await navigator.clipboard.readText();
            
            // Filter: Hanya ambil angka, dan pastikan minimal 10 digit (untuk menghindari teks lain)
            const cleanText = text.replace(/\D/g, ''); 
            
            if (cleanText.length >= 10) {
                inputField.value = cleanText;
            } else {
                alert("Clipboard tidak berisi nomor yang valid (minimal 10 digit).");
            }
        } catch (err) {
            alert("Gagal membaca clipboard. Pastikan Anda sudah memberikan izin akses (Allow) pada browser.");
        }
    }

    // 2. Logika Copy Hasil
    function copyResult() {
        if (inputField.value === "") return;
        inputField.select();
        navigator.clipboard.writeText(inputField.value);
        alert("Berhasil disalin!");
    }

    // 3. Logika Hapus (Hanya hapus hasil di kolom)
    function hapusInput() {
        inputField.value = "";
    }

    // Opsi tambahan: Auto-paste saat halaman pertama kali dimuat
    window.onload = autoPaste;
</script>

</body>
</html>
