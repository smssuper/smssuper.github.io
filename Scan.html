<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-Sync VA</title>
    
    <script type="module">
        // Import Firebase App dan Realtime Database
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

        // Konfigurasi Firebase Anda
        const firebaseConfig = {
            apiKey: "AIzaSyBczEs357-LAAkF8TsSsm1ZC7b57aC2FkA",
            authDomain: "vacopy-1ced3.firebaseapp.com",
            databaseURL: "https://vacopy-1ced3-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "vacopy-1ced3",
            storageBucket: "vacopy-1ced3.firebasestorage.app",
            messagingSenderId: "876438682543",
            appId: "1:876438682543:web:cef32ca1b989cae2410d5a",
            measurementId: "G-N73YZJLG5M"
        };

        // Inisialisasi Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const dataRef = ref(db, 'nomor_va');
        const inputField = document.getElementById('hasilInput');

        // 1. Membaca data dari Firebase (Muncul di perangkat lain)
        onValue(dataRef, (snapshot) => {
            const data = snapshot.val();
            if (data && data.nomor) {
                inputField.value = data.nomor;
            }
        });

        // 2. Logika Auto-Paste & Simpan ke Firebase
        window.autoPaste = async function() {
            try {
                const text = await navigator.clipboard.readText();
                const cleanText = text.replace(/\D/g, ''); 
                
                if (cleanText.length >= 10) {
                    inputField.value = cleanText;
                    set(dataRef, { nomor: cleanText }); 
                }
            } catch (err) { 
                // Abaikan error tanpa alert jika sedang membaca dari device lain
                console.log("Menunggu izin clipboard.");
            }
        };

        // 3. Logika Tombol Copy (Untuk menyalin di perangkat penerima)
        window.copyNomor = function() {
            if (inputField.value === "") {
                alert("Kosong! Tidak ada nomor untuk disalin.");
                return;
            }
            navigator.clipboard.writeText(inputField.value).then(() => {
                alert("Berhasil disalin: " + inputField.value);
            }).catch(() => {
                alert("Gagal menyalin nomor.");
            });
        };

        // 4. Logika Tombol Hapus
        window.hapusInput = function() {
            inputField.value = "";
            set(dataRef, { nomor: "" });
        };
    </script>
    
    <style>
        body { 
            font-family: Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 40px 20px; 
            background: #f4f4f9; 
            margin: 0;
        }
        .container { 
            background: white; 
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
        }
        h2 { color: #333; margin-bottom: 5px; }
        p { font-size: 13px; color: #666; margin-bottom: 25px; }
        
        input { 
            width: 90%; 
            padding: 15px; 
            margin-bottom: 20px; 
            font-size: 20px; 
            border: 2px solid #ddd; 
            border-radius: 8px; 
            text-align: center; 
            font-weight: bold; 
            color: #ee4d2d; 
            background-color: #fffaf9;
            cursor: pointer;
        }
        
        /* Layout untuk mengembalikan tombol berdampingan */
        .button-group { 
            display: flex; 
            gap: 15px; 
            width: 100%;
        }
        button { 
            flex: 1; 
            padding: 15px; 
            border: none; 
            border-radius: 8px; 
            color: white; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 16px;
            transition: 0.2s;
        }
        
        .btn-copy { background-color: #2196F3; } /* Biru */
        .btn-copy:hover { background-color: #0b7dda; }
        
        .btn-hapus { background-color: #f44336; } /* Merah */
        .btn-hapus:hover { background-color: #da190b; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Sync VA Data</h2>
        <p>Klik kolom di bawah untuk mengambil angka yang di-copy</p>
        
        <!-- Kolom Input untuk Auto-Paste -->
        <input type="text" id="hasilInput" placeholder="Tekan di sini..." onclick="autoPaste()" readonly>
        
        <!-- Tampilan tombol dikembalikan seperti semula -->
        <div class="button-group">
            <button class="btn-copy" onclick="copyNomor()">Copy</button>
            <button class="btn-hapus" onclick="hapusInput()">Hapus</button>
        </div>
    </div>

</body>
</html>
