<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-Sync VA</title>
    
    <script type="module">
        // Import Firebase SDK (ditambah push dan remove untuk daftar riwayat)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, remove } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

        // Konfigurasi Firebase Anda
        const firebaseConfig = {
            apiKey: "AIzaSyBczEs357-LAAkF8TsSsm1ZC7b57aC2FkA",
            authDomain: "vacopy-1ced3.firebaseapp.com",
            databaseURL: "https://vacopy-1ced3-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "vacopy-1ced3",
            storageBucket: "vacopy-1ced3.firebasestorage.app",
            messagingSenderId: "876438682543",
            appId: "1:876438682543:web:cef32ca1b989cae2410d5a",
            measurementId: "G-N73YZJLG5M"
        };

        // Inisialisasi Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const dataRef = ref(db, 'nomor_va');
        const historyRef = ref(db, 'riwayat_va');
        
        const inputField = document.getElementById('hasilInput');
        const historyList = document.getElementById('historyList');

        // Fungsi untuk mengubah warna kolom input menjadi hijau jika terisi
        function updateColor() {
            if (inputField.value !== "") {
                inputField.classList.add("input-terisi");
            } else {
                inputField.classList.remove("input-terisi");
            }
        }

        // Format jam saat ini (HH:MM:SS)
        function getCurrentTime() {
            const now = new Date();
            return now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' }).replace(/\./g, ':');
        }

        // 1. Membaca data utama dari Firebase secara real-time
        onValue(dataRef, (snapshot) => {
            const data = snapshot.val();
            if (data && data.nomor) {
                inputField.value = data.nomor;
            } else {
                inputField.value = "";
            }
            updateColor();
        });

        // 1b. Membaca daftar riwayat paste dari Firebase secara real-time
        onValue(historyRef, (snapshot) => {
            historyList.innerHTML = "";
            const items = [];
            snapshot.forEach((childSnapshot) => {
                items.push({
                    key: childSnapshot.key,
                    ...childSnapshot.val()
                });
            });

            // Urutkan dari yang terbaru di atas, namun nomor urut tetap sesuai urutan masuk
            items.reverse().forEach((item, index) => {
                const nomorUrut = items.length - index;
                const card = document.createElement('div');
                card.className = 'history-card';
                card.innerHTML = `
                    <span class="col-no">${nomorUrut}.</span>
                    <span class="col-jam">${item.jam || '-'}</span>
                    <span class="col-nomor" title="Klik untuk copy" onclick="copyDariList('${item.nomor}')">${item.nomor}</span>
                    <button class="btn-del-item" onclick="hapusItem('${item.key}')" title="Hapus">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                    </button>
                `;
                historyList.appendChild(card);
            });
        });

        // 2. Logika Auto-Paste (Saat kolom diklik) + Simpan ke daftar
        window.autoPaste = async function() {
            try {
                const text = await navigator.clipboard.readText();
                // Hanya ambil angka (bersihkan dari spasi/karakter lain)
                const cleanText = text.replace(/\D/g, ''); 
                
                if (cleanText.length >= 10) {
                    inputField.value = cleanText;
                    // Simpan ke Firebase utama
                    set(dataRef, { nomor: cleanText }); 
                    // Simpan ke daftar riwayat paste
                    push(historyRef, {
                        nomor: cleanText,
                        jam: getCurrentTime()
                    });
                    updateColor();
                }
            } catch (err) { 
                console.log("Izin clipboard diperlukan."); 
            }
        };

        // 3. Logika Copy (Tanpa notifikasi/alert)
        window.copyNomor = function() {
            if (inputField.value !== "") {
                navigator.clipboard.writeText(inputField.value);
            }
        };

        // Copy cepat jika angka di daftar diklik
        window.copyDariList = function(nomor) {
            navigator.clipboard.writeText(nomor);
        };

        // 4. Logika Hapus Input Utama (Hapus UI dan Firebase)
        window.hapusInput = function() {
            inputField.value = "";
            set(dataRef, { nomor: "" });
            updateColor();
        };

        // 5. Logika Hapus Kartu dari Daftar
        window.hapusItem = function(key) {
            remove(ref(db, 'riwayat_va/' + key));
        };
    </script>
    
    <style>
        body { 
            font-family: Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 10px 15px 30px 15px; /* Digeser dekat dengan garis tepi atas */
            background: #f4f4f9; 
            margin: 0;
        }
        .container { 
            background: white; 
            padding: 15px; /* Padding dikurangi agar lebih rapat ke atas */
            border-radius: 15px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
            box-sizing: border-box;
        }
        
        input { 
            box-sizing: border-box; 
            width: 100%; 
            padding: 15px; 
            margin-bottom: 12px; 
            font-size: 20px; 
            border: 2px solid #ddd; 
            border-radius: 8px; 
            text-align: center; 
            font-weight: bold; 
            color: #ee4d2d; 
            background-color: #fffaf9;
            cursor: pointer;
            transition: all 0.3s ease-in-out;
            outline: none;
        }
        
        /* Style saat kolom terisi nomor (warna hijau tebal) */
        .input-terisi {
            border: 4px solid #00C853 !important; 
            background-color: #eafaf1 !important; 
            color: #27ae60 !important; 
            box-shadow: 0 0 8px rgba(0, 200, 83, 0.3) !important; 
        }
        
        .button-group { 
            display: flex; 
            gap: 12px; 
            width: 100%;
        }
        .button-group button { 
            flex: 1; 
            padding: 14px; 
            border: none; 
            border-radius: 8px; 
            color: white; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 16px;
            transition: 0.2s;
        }
        
        .btn-copy { background-color: #2196F3; } 
        .btn-copy:hover { background-color: #0b7dda; }
        
        .btn-hapus { background-color: #f44336; } 
        .btn-hapus:hover { background-color: #da190b; }

        /* Bagian Daftar Hasil Paste */
        .history-wrapper {
            width: 100%;
            max-width: 400px;
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .history-card {
            background: white;
            padding: 8px 12px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            border-left: 3px solid #00C853;
        }

        .col-no {
            font-weight: bold;
            color: #666;
            width: 24px;
            text-align: left;
            flex-shrink: 0;
        }

        .col-jam {
            color: #888;
            font-size: 11px;
            width: 58px;
            text-align: left;
            flex-shrink: 0;
        }

        .col-nomor {
            flex: 1;
            font-weight: bold;
            color: #222;
            font-size: 14px;
            text-align: left;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: pointer;
            padding: 0 6px;
        }

        .col-nomor:active {
            color: #2196F3;
        }

        .btn-del-item {
            background: transparent;
            border: none;
            color: #f44336;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            flex-shrink: 0;
            transition: background 0.2s;
        }

        .btn-del-item:hover {
            background: #ffebee;
        }
    </style>
</head>
<body>

    <div class="container">
        <input type="text" id="hasilInput" placeholder="Tekan di sini..." onclick="autoPaste()" readonly>
        
        <div class="button-group">
            <button class="btn-copy" onclick="copyNomor()">Copy</button>
            <button class="btn-hapus" onclick="hapusInput()">Hapus</button>
        </div>
    </div>

    <!-- Daftar Hasil Paste Minimalis -->
    <div id="historyList" class="history-wrapper"></div>

</body>
</html>
