<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Scan Nomor VA</title>
    <!-- Library Tesseract.js untuk OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; background: #f4f4f9; }
        .container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        
        /* Area Kamera Live */
        #videoContainer { position: relative; width: 100%; height: 250px; background: #000; overflow: hidden; border-radius: 8px; margin-bottom: 15px; display: none; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        input { width: 90%; padding: 12px; margin-bottom: 10px; font-size: 18px; border: 2px solid #ddd; border-radius: 5px; text-align: center; font-weight: bold; color: #ee4d2d; }
        
        .button-group { display: flex; gap: 10px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 5px; color: white; font-weight: bold; cursor: pointer; }
        .btn-scan { background-color: #ff5722; }
        .btn-copy { background-color: #2196F3; }
        .btn-hapus { background-color: #f44336; }
    </style>
</head>
<body>

<div class="container">
    <h2>Live Scanner VA</h2>
    
    <div id="videoContainer">
        <video id="video" autoplay playsinline></video>
    </div>

    <input type="text" id="hasilScan" placeholder="Nomor akan muncul di sini..." readonly>
    
    <div class="button-group">
        <button class="btn-scan" onclick="startScanner()">Scan</button>
        <button class="btn-copy" onclick="copyNomor()">Copy</button>
        <button class="btn-hapus" onclick="stopScanner()">Hapus/Stop</button>
    </div>
</div>

<script>
    let video = document.getElementById('video');
    let videoContainer = document.getElementById('videoContainer');
    let hasilScan = document.getElementById('hasilScan');
    let worker;

    async function startScanner() {
        videoContainer.style.display = 'block';
        hasilScan.value = "Mencari nomor...";
        
        // Inisialisasi Tesseract Worker
        worker = await Tesseract.createWorker('eng');
        await worker.setParameters({ tessedit_char_whitelist: '0123456789 ' });

        // Akses kamera
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        video.srcObject = stream;

        // Loop untuk memproses frame video setiap 1 detik
        setInterval(async () => {
            if (video.srcObject) {
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                
                const { data: { text } } = await worker.recognize(canvas);
                const match = text.match(/(?:\d\s*){10,}/); // Cari deretan angka > 10 digit

                if (match) {
                    hasilScan.value = match[0].replace(/\s/g, '');
                    stopScanner(); // Berhenti otomatis jika sudah ketemu
                }
            }
        }, 1000);
    }

    function stopScanner() {
        if (video.srcObject) {
            video.srcObject.getTracks().forEach(track => track.stop());
            video.srcObject = null;
        }
        videoContainer.style.display = 'none';
        if (worker) worker.terminate();
    }

    function copyNomor() {
        navigator.clipboard.writeText(hasilScan.value);
        alert("Berhasil disalin: " + hasilScan.value);
    }
</script>

</body>
</html>
