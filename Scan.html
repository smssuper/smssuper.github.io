<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-Sync VA</title>
    
    <script type="module">
        // Import Firebase SDK
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

        // Konfigurasi Firebase Anda
        const firebaseConfig = {
            apiKey: "AIzaSyBczEs357-LAAkF8TsSsm1ZC7b57aC2FkA",
            authDomain: "vacopy-1ced3.firebaseapp.com",
            databaseURL: "https://vacopy-1ced3-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "vacopy-1ced3",
            storageBucket: "vacopy-1ced3.firebasestorage.app",
            messagingSenderId: "876438682543",
            appId: "1:876438682543:web:cef32ca1b989cae2410d5a",
            measurementId: "G-N73YZJLG5M"
        };

        // Inisialisasi Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const dataRef = ref(db, 'nomor_va');
        const inputField = document.getElementById('hasilInput');

        // 1. Membaca data dari Firebase secara real-time
        onValue(dataRef, (snapshot) => {
            const data = snapshot.val();
            if (data && data.nomor) {
                inputField.value = data.nomor;
            } else {
                inputField.value = "";
            }
        });

        // 2. Logika Auto-Paste (Saat kolom diklik)
        window.autoPaste = async function() {
            try {
                const text = await navigator.clipboard.readText();
                // Hanya ambil angka (bersihkan dari spasi/karakter lain)
                const cleanText = text.replace(/\D/g, ''); 
                
                if (cleanText.length >= 10) {
                    inputField.value = cleanText;
                    // Simpan ke Firebase
                    set(dataRef, { nomor: cleanText }); 
                }
            } catch (err) { 
                console.log("Izin clipboard diperlukan."); 
            }
        };

        // 3. Logika Copy (Tanpa notifikasi/alert)
        window.copyNomor = function() {
            if (inputField.value !== "") {
                navigator.clipboard.writeText(inputField.value);
            }
        };

        // 4. Logika Hapus (Hapus UI dan Firebase)
        window.hapusInput = function() {
            inputField.value = "";
            set(dataRef, { nomor: "" });
        };
    </script>
    
    <style>
        body { 
            font-family: Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 40px 20px; 
            background: #f4f4f9; 
            margin: 0;
        }
        .container { 
            background: white; 
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
        }
        h2 { color: #333; margin-bottom: 5px; }
        p { font-size: 13px; color: #666; margin-bottom: 25px; }
        
        input { 
            width: 90%; 
            padding: 15px; 
            margin-bottom: 20px; 
            font-size: 20px; 
            border: 2px solid #ddd; 
            border-radius: 8px; 
            text-align: center; 
            font-weight: bold; 
            color: #ee4d2d; 
            background-color: #fffaf9;
            cursor: pointer;
        }
        
        .button-group { 
            display: flex; 
            gap: 15px; 
            width: 100%;
        }
        button { 
            flex: 1; 
            padding: 15px; 
            border: none; 
            border-radius: 8px; 
            color: white; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 16px;
            transition: 0.2s;
        }
        
        .btn-copy { background-color: #2196F3; } 
        .btn-copy:hover { background-color: #0b7dda; }
        
        .btn-hapus { background-color: #f44336; } 
        .btn-hapus:hover { background-color: #da190b; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Sync VA Data</h2>
        <p>Klik kolom di bawah untuk mengambil angka yang di-copy</p>
        
        <input type="text" id="hasilInput" placeholder="Tekan di sini..." onclick="autoPaste()" readonly>
        
        <div class="button-group">
            <button class="btn-copy" onclick="copyNomor()">Copy</button>
            <button class="btn-hapus" onclick="hapusInput()">Hapus</button>
        </div>
    </div>

</body>
</html>
