<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Catatan Pengerjaan</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        :root {
            --primary: #0f172a;
            --primary-hover: #1e293b;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --danger-bg: #fee2e2;
            --success: #16a34a;
            --success-bg: #dcfce7;
            --warning: #f59e0b;
            --warning-hover: #d97706;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --border: #e2e8f0;
            --text-main: #334155;
            --text-muted: #64748b;
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--bg-body); color: var(--text-main); display: flex; justify-content: center; padding: 20px 10px; margin: 0; }
        .container { background-color: var(--bg-card); width: 100%; max-width: 700px; padding: 24px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); }
        h2 { font-size: 1.25rem; font-weight: 600; color: var(--primary); margin: 0 0 24px 0; padding-bottom: 16px; border-bottom: 1px solid var(--border); text-align: center; }
        .form-group { display: flex; flex-direction: column; margin-bottom: 16px; }
        .form-group label { font-size: 0.875rem; font-weight: 500; margin-bottom: 6px; color: var(--primary); }
        .form-group input { font-family: 'Inter', sans-serif; padding: 10px 14px; font-size: 0.95rem; border: 1px solid var(--border); border-radius: 8px; outline: none; transition: all 0.2s ease; }
        .form-group input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        
        .action-buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; margin-bottom: 32px; }
        button { font-family: 'Inter', sans-serif; flex: 1; min-width: 80px; padding: 10px 12px; font-size: 0.875rem; font-weight: 500; border: none; border-radius: 8px; cursor: pointer; color: white; }
        button:disabled { background-color: var(--border) !important; color: var(--text-muted) !important; cursor: not-allowed; }
        #btnSimpan { background-color: var(--primary); }
        #btnEdit { background-color: var(--warning); }
        #btnHapus { background-color: var(--danger); }
        #btnBatal { background-color: transparent; color: var(--text-muted); border: 1px solid var(--border); display: none; }
        
        .table-container { border: 1px solid var(--border); border-radius: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; min-width: 500px; border-collapse: collapse; text-align: left; font-size: 0.875rem; }
        th, td { padding: 14px 16px; border-bottom: 1px solid var(--border); white-space: nowrap; }
        th { background-color: #f8fafc; color: var(--text-muted); font-weight: 500; font-size: 0.75rem; }
        tbody tr { cursor: pointer; background-color: var(--bg-card); }
        tbody tr.terpilih { background-color: #e2e8f0; border-left: 4px solid var(--primary); }
        .data-kosong { text-align: center; color: var(--text-muted); padding: 24px !important; font-style: italic; }
        
        .aksi-kolom { display: flex; gap: 10px; align-items: center; }
        .ikon-aksi { width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background-color: #f1f5f9; color: var(--text-muted); cursor: pointer; border: 1px solid transparent; }
        .ikon-aksi.aktif-selesai { background-color: var(--success-bg); color: var(--success); border-color: var(--success); }
        .ikon-aksi.aktif-gagal { background-color: var(--danger-bg); color: var(--danger); border-color: var(--danger); }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.4); display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; z-index: 1000; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-box { background: white; width: 90%; max-width: 350px; padding: 24px; border-radius: 12px; text-align: center; }
        .modal-box h3 { margin: 0 0 12px 0; color: var(--primary); }
        .modal-box p { margin: 0 0 24px 0; color: var(--text-muted); font-size: 0.95rem; }
        .modal-actions { display: flex; gap: 12px; justify-content: center; }
        .btn-modal { padding: 8px 16px; border-radius: 6px; font-weight: 500; cursor: pointer; border: none; }
        .btn-modal-ok { background-color: var(--primary); color: white; }
        .btn-modal-batal { background-color: transparent; color: var(--text-main); border: 1px solid var(--border); }
    </style>
    
    <!-- MENGGUNAKAN FIREBASE VERSI COMPAT (Aman untuk Aplikasi Android) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

    <div class="container">
        <h2>CATATAN PENGERJAAN</h2>

        <div class="form-group">
            <label>Tanggal</label>
            <input type="date" id="inputTanggal">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="inputEmail" placeholder="nama@email.com">
        </div>
        <div class="form-group">
            <label>Jam</label>
            <input type="time" id="inputJam">
        </div>

        <div class="action-buttons">
            <button id="btnSimpan" onclick="simpanData()">Simpan</button>
            <button id="btnEdit" onclick="editData()" disabled>Edit</button>
            <button id="btnHapus" onclick="konfirmasiHapus()" disabled>Hapus</button>
            <button id="btnBatal" onclick="resetForm()">Batal</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Tanggal</th>
                        <th>Email</th>
                        <th>Jam</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="daftarData"></tbody>
            </table>
        </div>
    </div>

    <div id="customModal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="modalTitle">Peringatan</h3>
            <p id="modalMessage">Pesan</p>
            <div class="modal-actions">
                <button id="modalBtnBatal" class="btn-modal btn-modal-batal" onclick="tutupModal()">Batal</button>
                <button id="modalBtnOk" class="btn-modal btn-modal-ok">OK</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT JAVASCRIPT TANPA TYPE MODULE -->
    <script>
        // Konfigurasi Database Anda
        const firebaseConfig = {
            databaseURL: "https://catatanproyek-adcff-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };

        // Inisialisasi Firebase Compat
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const catatanRef = db.ref('catatan');

        let daftarCatatan = [];
        let idTerpilih = null; 

        // AMBIL DATA REALTIME
        catatanRef.on('value', (snapshot) => {
            daftarCatatan = [];
            snapshot.forEach((childSnapshot) => {
                daftarCatatan.push({ id: childSnapshot.key, ...childSnapshot.val() });
            });
            renderTabel();
        });

        // NOTIFIKASI
        function tampilkanModal(judul, pesan, tipe, callback = null) {
            document.getElementById('modalTitle').innerText = judul;
            document.getElementById('modalMessage').innerText = pesan;
            const btnBatal = document.getElementById('modalBtnBatal');
            const btnOk = document.getElementById('modalBtnOk');

            if (tipe === 'alert') {
                btnBatal.style.display = 'none';
                btnOk.innerText = 'Mengerti';
                btnOk.onclick = tutupModal;
            } else if (tipe === 'confirm') {
                btnBatal.style.display = 'block';
                btnOk.innerText = 'Ya, Hapus';
                btnOk.style.backgroundColor = 'var(--danger)'; 
                btnOk.onclick = () => {
                    tutupModal();
                    if(callback) callback();
                };
            }
            document.getElementById('customModal').classList.add('active');
        }

        function tutupModal() {
            document.getElementById('customModal').classList.remove('active');
            setTimeout(() => { document.getElementById('modalBtnOk').style.backgroundColor = 'var(--primary)'; }, 300);
        }

        // RENDER TABEL
        function renderTabel() {
            const tbody = document.getElementById('daftarData');
            tbody.innerHTML = ''; 

            if (daftarCatatan.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="data-kosong">Belum ada catatan.</td></tr>`;
                return;
            }

            daftarCatatan.forEach((data, index) => {
                const tr = document.createElement('tr');
                tr.onclick = function() { pilihBaris(data.id); };

                if (idTerpilih === data.id) tr.classList.add('terpilih');

                const classSelesai = data.status === 'selesai' ? 'aktif-selesai' : '';
                const classGagal = data.status === 'gagal' ? 'aktif-gagal' : '';

                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${formatTanggal(data.tanggal)}</td>
                    <td>${data.email}</td>
                    <td>${data.jam}</td>
                    <td>
                        <div class="aksi-kolom">
                            <div class="ikon-aksi ${classSelesai}" onclick="ubahStatus('${data.id}', 'selesai', event)">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                            </div>
                            <div class="ikon-aksi ${classGagal}" onclick="ubahStatus('${data.id}', 'gagal', event)">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                            </div>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function formatTanggal(tgl) {
            if(!tgl) return '';
            return new Date(tgl).toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
        }

        function ubahStatus(id, statusBaru, event) {
            event.stopPropagation(); 
            const dataAwal = daftarCatatan.find(d => d.id === id);
            const statusFinal = dataAwal.status === statusBaru ? null : statusBaru;
            db.ref('catatan/' + id).update({ status: statusFinal });
        }

        function simpanData() {
            const tanggal = document.getElementById('inputTanggal').value;
            const email = document.getElementById('inputEmail').value;
            const jam = document.getElementById('inputJam').value;

            if (!tanggal || !email || !jam) {
                tampilkanModal("Belum Lengkap", "Harap isi semua kolom.", "alert");
                return;
            }

            document.getElementById('btnSimpan').innerText = "Memproses...";
            const refBaru = db.ref('catatan').push();
            
            refBaru.set({ tanggal, email, jam, status: null }).then(() => {
                document.getElementById('btnSimpan').innerText = "Simpan";
                resetForm();
            });
        }

        function pilihBaris(id) {
            if (idTerpilih === id) { resetForm(); return; }
            idTerpilih = id;
            const data = daftarCatatan.find(d => d.id === id);

            document.getElementById('inputTanggal').value = data.tanggal;
            document.getElementById('inputEmail').value = data.email;
            document.getElementById('inputJam').value = data.jam;

            document.getElementById('btnSimpan').disabled = true;
            document.getElementById('btnEdit').disabled = false;
            document.getElementById('btnHapus').disabled = false;
            document.getElementById('btnBatal').style.display = 'inline-block';
            renderTabel(); 
        }

        function editData() {
            if (!idTerpilih) return;
            const tanggal = document.getElementById('inputTanggal').value;
            const email = document.getElementById('inputEmail').value;
            const jam = document.getElementById('inputJam').value;

            if (!tanggal || !email || !jam) return;
            
            document.getElementById('btnEdit').innerText = "Memproses...";
            db.ref('catatan/' + idTerpilih).update({ tanggal, email, jam }).then(() => {
                document.getElementById('btnEdit').innerText = "Edit";
                resetForm();
            });
        }

        function konfirmasiHapus() {
            if (!idTerpilih) return;
            tampilkanModal("Hapus Data?", "Data ini akan dihapus permanen.", "confirm", () => {
                db.ref('catatan/' + idTerpilih).remove().then(() => resetForm());
            });
        }

        function resetForm() {
            document.getElementById('inputTanggal').value = '';
            document.getElementById('inputEmail').value = '';
            document.getElementById('inputJam').value = '';
            idTerpilih = null;
            document.getElementById('btnSimpan').disabled = false;
            document.getElementById('btnEdit').disabled = true;
            document.getElementById('btnHapus').disabled = true;
            document.getElementById('btnBatal').style.display = 'none';
            renderTabel();
        }
    </script>
</body>
</html>
